{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Регистрация</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Имя пользователя<input name="username" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Пароль<input type="password" name="password" required></label>
        <button class="green-btn" type="submit">Создать аккаунт</button>
    </form>
</div>
{% endblock %}
